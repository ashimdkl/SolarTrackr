; solar tracker firmware, ece capstone team 20
;
; envs
;   devkitm1  the real board. esp32-devkitm-1 has no official platformio board
;             definition, so this uses the generic esp32dev (same 4mb flash).
;   native    unit tests on the laptop:        pio test -e native
;   sim       full simulated day on the laptop: pio run -e sim -t exec
;
; native and sim need a host c++ compiler (on windows: mingw-w64 / msys2 g++ on PATH).

[platformio]
default_envs = devkitm1

[env:devkitm1]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<sim/>
build_flags = -Wall
lib_deps =
    mikalhart/TinyGPSPlus
    adafruit/Adafruit INA260 Library

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<core/>
build_flags = -std=c++11 -Wall -lm

[env:sim]
platform = native
build_src_filter = -<*> +<core/> +<sim/>
build_flags = -std=c++11 -Wall -lm
